<!DOCTYPE html>
<html>
<head>
    <title>Ransomware Detection</title>
</head>
<body>

    <h1>Ransomware Detection Using Machine Learning</h1>

    <form action="/predict" method="POST">

        <label>CPU Usage:</label><br>
        <input type="number" name="cpu" required><br><br>

        <label>File Changes:</label><br>
        <input type="number" name="files" required><br><br>

        <label>Encryption Rate:</label><br>
        <input type="number" name="encryption" required><br><br>

        <label>Network Activity:</label><br>
        <input type="number" name="network" required><br><br>

        <button type="submit">Predict</button>

    </form>

</body>
</html>
