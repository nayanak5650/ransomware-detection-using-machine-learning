<!DOCTYPE html>
<html>
<head>
    <title>Ransomware Detection System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark">

<div class="container mt-5">
    <div class="card shadow-lg">
        <div class="card-header bg-danger text-white text-center">
            <h2>🛡️ Ransomware Detection System</h2>
        </div>

        <div class="card-body">

            <p class="text-center">
                Enter system activity values to check for ransomware threats.
            </p>

            <form action="/predict" method="POST">

                <div class="mb-3">
                    <label class="form-label">CPU Usage (%)</label>
                    <input type="number" class="form-control" name="cpu" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">File Changes</label>
                    <input type="number" class="form-control" name="files" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Encryption Rate</label>
                    <input type="number" class="form-control" name="encryption" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Network Activity</label>
                    <input type="number" class="form-control" name="network" required>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-danger">
                        Predict Threat
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>

</body>
</html>
